name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src/mediascribe/cli
          ruff check src/mediascribe/core/config.py
          ruff check src/mediascribe/steps/review.py src/mediascribe/steps/translate.py
          ruff check tests/test_cli_config_commands.py tests/test_config_persistence.py

      - name: Run tests
        run: pytest
