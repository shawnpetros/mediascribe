name: Release

# Automatically tags and releases when the version in pyproject.toml
# changes on main. Directly triggers the publish workflow since tags
# pushed by GITHUB_TOKEN don't trigger other workflows.
#
# Flow: merge to main -> create tag -> trigger publish workflow

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

permissions:
  contents: write
  actions: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.check.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if tag already exists
        id: check
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists — skipping"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist — will create"
          fi

      - name: Create and push tag
        if: steps.check.outputs.created == 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

  trigger-publish:
    needs: auto-tag
    if: needs.auto-tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ needs.auto-tag.outputs.tag }}" \
            -f tag="${{ needs.auto-tag.outputs.tag }}"
          echo "Triggered publish for ${{ needs.auto-tag.outputs.tag }}"
